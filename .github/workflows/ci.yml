name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  migrations:
    name: Migrations apply cleanly (Postgres 15)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          # Stand in for Supabase's auth schema so FK references resolve.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create schema if not exists auth; create table if not exists auth.users (id uuid primary key); create or replace function auth.uid() returns uuid language sql stable as \$\$ select null::uuid \$\$;"
          for f in supabase/migrations/*.sql; do echo "== $f"; psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"; done
      - name: RLS enabled on every public table
        env:
          PGPASSWORD: postgres
        run: |
          missing=$(psql -h localhost -U postgres -tA -c "select string_agg(relname, ', ') from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and not c.relrowsecurity")
          if [ -n "$missing" ]; then echo "Tables without RLS: $missing"; exit 1; fi
          echo "RLS enabled on all public tables."
